<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Memory">
  <defs>
    <linearGradient id="bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e2e2e"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="18" y1="10" x2="26" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c47a2a"/>
      <stop offset="1" stop-color="#ad6a1e"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- stored trace -->
  <circle cx="9" cy="16" r="3" fill="#5a5a5a"/>
  <circle cx="9" cy="16" r="5.5" fill="#5a5a5a" opacity="0.15"/>
  <!-- synaptic cleft -->
  <line x1="12.2" y1="16" x2="14.8" y2="16" stroke="#777" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="17.2" y1="16" x2="19.8" y2="16" stroke="url(#accent)" stroke-width="1.3" stroke-linecap="round"/>
  <!-- active recall -->
  <circle cx="23" cy="16" r="3.6" fill="url(#accent)"/>
  <circle cx="23" cy="16" r="6.5" fill="#ad6a1e" opacity="0.2"/>
</svg>
