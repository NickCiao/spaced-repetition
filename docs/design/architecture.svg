<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="368" viewBox="0 0 900 368" role="img" aria-label="One Cloudflare Worker backed by D1 and R2 serves phone and Mac; occasional export and import to local markdown; a daily reminder email starts the review loop" font-family="'Helvetica Neue', Arial, sans-serif">
  <title>Architecture: one worker, one canonical store</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="368" fill="#ffffff"/>

  <!-- Cloudflare group -->
  <rect x="300" y="44" width="260" height="272" rx="8" fill="#f6f6f4" stroke="#d8d8d4"/>
  <text x="430" y="68" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#8a8a86">CLOUDFLARE · FREE TIER</text>

  <!-- Worker -->
  <rect x="320" y="86" width="220" height="88" rx="6" fill="#ffffff" stroke="#8f8a83"/>
  <text x="430" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">Worker</text>
  <text x="430" y="134" text-anchor="middle" font-size="12" fill="#4d4d4d">review · capture · inbox</text>
  <text x="430" y="152" text-anchor="middle" font-size="12" fill="#4d4d4d">settings · email cron</text>

  <!-- D1 + R2 -->
  <rect x="320" y="228" width="132" height="58" rx="6" fill="#f9f1de" stroke="#ad8a3b" stroke-width="1.2"/>
  <text x="386" y="252" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">D1</text>
  <text x="386" y="272" text-anchor="middle" font-size="12" fill="#7a6327">canonical store</text>

  <rect x="464" y="228" width="76" height="58" rx="6" fill="#ffffff" stroke="#8f8a83"/>
  <text x="502" y="252" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">R2</text>
  <text x="502" y="272" text-anchor="middle" font-size="12" fill="#4d4d4d">images</text>

  <line x1="386" y1="174" x2="386" y2="223" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="502" y1="174" x2="502" y2="223" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="444" y="204" text-anchor="middle" font-size="12" fill="#4d4d4d">reads / writes</text>

  <!-- Devices -->
  <rect x="20" y="72" width="180" height="64" rx="6" fill="#ffffff" stroke="#8f8a83"/>
  <text x="110" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">Phone</text>
  <text x="110" y="118" text-anchor="middle" font-size="12" fill="#4d4d4d">PWA · share sheet · email</text>

  <rect x="20" y="210" width="180" height="64" rx="6" fill="#ffffff" stroke="#8f8a83"/>
  <text x="110" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">Mac</text>
  <text x="110" y="256" text-anchor="middle" font-size="12" fill="#4d4d4d">browser · email</text>

  <!-- Device edges: symmetric on purpose — every loop closes on either device -->
  <line x1="200" y1="104" x2="316" y2="114" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="250" y="96" text-anchor="middle" font-size="11.5" fill="#3d3d3d">HTTPS · token</text>

  <line x1="200" y1="242" x2="316" y2="160" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="253" y="194" text-anchor="middle" font-size="11.5" fill="#3d3d3d" transform="rotate(-35 253 194)">HTTPS · token</text>

  <!-- Reminder email -->
  <path d="M 334,82 C 310,30 180,22 114,66" fill="none" stroke="#555555" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="258" y="22" text-anchor="middle" font-size="12" fill="#4d4d4d">daily reminder email · Resend</text>

  <!-- Local markdown -->
  <rect x="706" y="138" width="170" height="84" rx="6" fill="#ffffff" stroke="#8f8a83"/>
  <text x="791" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">Local markdown</text>
  <text x="791" y="186" text-anchor="middle" font-size="12" fill="#4d4d4d">refactor sessions</text>
  <text x="791" y="204" text-anchor="middle" font-size="12" fill="#4d4d4d">manual backup</text>

  <line x1="540" y1="128" x2="701" y2="152" stroke="#555555" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="620" y="118" text-anchor="middle" font-size="12" fill="#4d4d4d">export.zip</text>

  <line x1="706" y1="178" x2="545" y2="156" stroke="#555555" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="623" y="196" text-anchor="middle" font-size="12" fill="#4d4d4d">import</text>
  <text x="623" y="212" text-anchor="middle" font-size="12" fill="#4d4d4d">dry-run → confirm</text>

  <!-- Key -->
  <text x="450" y="346" text-anchor="middle" font-size="11.5" fill="#6e6e6e">solid — interactive · dashed — occasional / async</text>
</svg>
